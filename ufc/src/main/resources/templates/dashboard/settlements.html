<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- ✅ 정산 관리 프래그먼트 -->
    <div th:fragment="settlements">
        <div class="content-wrapper">
            <section class="card-container">
                <!-- Summary Section -->
                <div class="status-grid">
                    <div class="status-card">
                        <span>총 매출</span>
                        <p id="totalSales"
                            th:text="${#numbers.formatDecimal(totalSales ?: 0, 0, 'COMMA', 0, 'POINT')} + '원'">0원</p>
                    </div>
                    <div class="status-card">
                        <span>정산 예정</span>
                        <p id="scheduledSettlement"
                            th:text="${#numbers.formatDecimal(scheduledSettlement ?: 0, 0, 'COMMA', 0, 'POINT')} + '원'">
                            0원</p>
                    </div>
                    <div class="status-card">
                        <span>정산 완료</span>
                        <p id="completedSettlement"
                            th:text="${#numbers.formatDecimal(completedSettlement ?: 0, 0, 'COMMA', 0, 'POINT')} + '원'">
                            0원</p>
                    </div>
                    <div class="status-card">
                        <span>정산 대기</span>
                        <p id="pendingSettlement"
                            th:text="${#numbers.formatDecimal(pendingSettlement ?: 0, 0, 'COMMA', 0, 'POINT')} + '원'">0원
                        </p>
                    </div>
                </div>


            </section>

            <!-- Download Buttons -->
            <div class="batch-actions">
                <button class="btn btn-secondary" onclick="downloadExcel()">엑셀 다운로드</button>
                <!-- <button class="btn btn-secondary" onclick="downloadCSV()">CSV 다운로드</button> -->
            </div>
            <div class="search-section">
                <div class="search-row">
                    <label>정산 상태</label>
                    <select id="status" name="status">
                        <option value="all">전체</option>
                        <option value="scheduled">정산 예정</option>
                        <option value="completed">정산 완료</option>
                        <option value="pending">정산 대기</option>
                    </select>
                </div>
                <div class="search-row">
                    <label>정산 기간</label>
                    <div class="date-range">
                        <input type="date" class="search-input">
                        <span>~</span>
                        <input type="date" class="search-input">
                        <div class="period-buttons">
                            <button class="active">오늘</button>
                            <button>1주일</button>
                            <button>1개월</button>
                            <button>3개월</button>
                        </div>
                    </div>
                </div>
                <div class="search-actions">
                    <button class="btn btn-primary">검색</button>
                    <button class="btn btn-secondary">초기화</button>
                </div>
            </div>

            <!-- Settlement Table -->
            <div class="table-header">
                <div class="left-section">
                    <span>목록 (총 0개)</span>
                    <select>
                        <option>최신순</option>
                        <option>오래된순</option>
                    </select>
                    <!-- <select>
                        <option>100개씩 보기</option>
                    </select> -->
                </div>
                <!-- <button class="btn-secondary">조회항목 설정</button> -->
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>정산 ID</th>
                            <th>날짜</th>
                            <th>금액</th>
                            <th>상태</th>
                            <th>내역</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>

                </table>
            </div>
        </div>
        <div class="table-footer">
            <p>• 배송정보(배송방법/택배사/송장번호)가 등록된 주문 건의 경우 한 번에 정보를 일괄적용 수 있습니다.</p>
            <p>• 배송정보를 선택 후 주문 목록 상단/하단의 [발송처리] 버튼을 누르시면 처음 처리가 진행됩니다.</p>
            <p>• 송장번호의 수정이 필요하신 경우 아래의 주문 목록에서 대상 제품 선택 후 정보 수정을 하신 [송장수정] 버튼을 클릭하시면 수정 창이 제공됩니다.</p>
        </div>
        <!-- Settlement Details Modal -->
        <div id="settlementModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2>정산 상세 정보</h2>
                <div id="settlementDetails"></div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/dashboard/settlements.js}" async></script>
</body>

</html>
