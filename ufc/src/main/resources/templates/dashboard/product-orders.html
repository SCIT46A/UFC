<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>주문/발송 관리</title>
    <!-- 필요 시 CSS, 라이브러리 로드 -->
</head>

<body>
    <!-- th:fragment 추가 -->
    <div th:fragment="product-orders">
        <div class="content-wrapper">
            <section class="card-container">
                <div class="status-grid">
                    <div class="status-card">
                        <span>결제완료</span>
                        <span class="count">0</span> <!-- completed -->
                    </div>
                    <div class="status-card">
                        <span>발주완료</span>
                        <span class="count">0</span> <!-- ordered -->
                    </div>
                    <div class="status-card">
                        <span>배송완료</span>
                        <span class="count">0</span> <!-- delivery_completed -->
                    </div>
                    <div class="status-card warning">
                        <span>취소 요청</span>
                        <span class="count">0</span> <!-- pending -->
                    </div>
                    <div class="status-card danger">
                        <span>취소 완료</span>
                        <span class="count">0</span> <!-- cancelled -->
                    </div>
                </div>
            </section>

            <!-- Batch Actions -->
            <div class="batch-actions">
                <button class="btn btn-secondary" onclick="downloadOrderExcel()">주문 내역 다운로드</button>
                <button class="btn btn-warning" onclick="openBatchInvoiceModal()">송장번호 일괄등록</button>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-row">
                    <label>주문번호/상품명</label>
                    <input type="text" class="search-input" placeholder="주문번호 또는 상품명을 입력하세요">
                </div>
                <div class="search-row">
                    <label>주문상태</label>
                    <!-- id를 부여해서 이벤트 적용 -->
                    <select id="status" class="search-input">
                        <option value="">전체</option>
                        <option value="payment_completed">결제완료</option>
                        <option value="delivery_ready">배송준비중</option>
                        <option value="in_delivery">배송중</option>
                        <option value="delivery_completed">배송완료</option>
                        <option value="cancel_requested">취소요청</option>
                    </select>
                </div>
                <div class="search-row">
                    <label>주문 기간</label>
                    <div class="date-range">
                        <input type="date" class="search-input">
                        <span>~</span>
                        <input type="date" class="search-input">
                        <div class="period-buttons">
                            <button class="active">오늘</button>
                            <button>1주일</button>
                            <button>1개월</button>
                            <button>3개월</button>
                        </div>
                    </div>
                </div>
                <div class="search-actions">
                    <button class="btn btn-primary">검색</button>
                    <button class="btn btn-secondary">초기화</button>
                </div>
            </div>

            <!-- Order Table -->
            <div class="table-header">
                <div class="left-section">
                    <span>목록 (총 1개)</span>
                    <select>
                        <option>최근주문순</option>
                        <option>오래된주문순</option>
                        <option>취소요청</option>
                    </select>
                    <button class="btn btn-secondary" onclick="processSelectedOrders()">선택발주 처리</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>주문번호</th>
                            <th>주문일자</th>
                            <th>주문내역</th>
                            <th>고객명</th>
                            <th>연락처</th>
                            <th>주소</th>
                            <th>택배사</th>
                            <th>송장번호</th>
                            <th>관리</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body"></tbody>
                </table>
            </div>
            <div class="table-footer">
                <p>• 배송정보가 등록된 주문은 일괄적용할 수 있습니다.</p>
                <p>• 배송정보 선택 후 [발송처리] 버튼을 누르면 처음 처리가 진행됩니다.</p>
                <p>• 송장번호 수정이 필요하면 주문목록에서 [송장수정] 버튼을 클릭하세요.</p>
            </div>
        </div>

        <!-- Batch Invoice Modal -->
        <div id="batchInvoiceModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>송장번호 일괄등록</h3>
                    <button class="btn" onclick="closeBatchInvoiceModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="search-row">
                        <label>엑셀 업로드</label>
                        <input type="file" id="invoiceExcelUpload" accept=".xlsx">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="uploadInvoiceExcel()">업로드</button>
                    <button class="btn" onclick="closeBatchInvoiceModal()">취소</button>
                </div>
            </div>
        </div>
    </div>
    <!-- script 파일 로드 -->
    <script th:src="@{/js/dashboard/product-orders.js}" async></script>
</body>

</html>
