<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="product-management">
        <div class="content-wrapper">
            <!-- Status Cards -->
            <section class="card-container">
                <div class="status-grid">
                    <div class="status-card" data-status="full">
                        <span>전체</span>
                        <span class="count">0</span>
                    </div>
                    <div class="status-card" data-status="on-sale">
                        <span>판매중</span>
                        <span class="count">0</span>
                    </div>
                    <div class="status-card" data-status="waiting">
                        <span>판매대기</span>
                        <span class="count">0</span>
                    </div>
                    <div class="status-card" data-status="out-of-stock">
                        <span>품절</span>
                        <span class="count">0</span>
                    </div>
                    <div class="status-card" data-status="stopped">
                        <span>판매중지</span>
                        <span class="count">0</span>
                    </div>
                </div>
            </section>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-row">
                    <label>상품명/상품번호</label>
                    <input type="text" class="search-input" placeholder="상품명 또는 상품번호를 입력하세요">
                </div>
                <div class="search-row">
                    <label>태그</label>
                    <input type="text" class="search-input" placeholder="태그를 입력하세요">
                </div>
                <div class="search-row">
                    <label>기간</label>
                    <div class="date-range">
                        <input type="date" class="search-input">
                        <span>~</span>
                        <input type="date" class="search-input">
                        <div class="period-buttons">
                            <button class="active">오늘</button>
                            <button>1주일</button>
                            <button>1개월</button>
                            <button>3개월</button>
                        </div>
                    </div>
                </div>
                <div class="search-actions">
                    <button class="btn btn-primary">검색</button>
                    <button class="btn btn-secondary">초기화</button>
                </div>
            </div>

            <!-- Product Table -->
            <div class="table-header">
                <div class="left-section">
                    <span>목록 (총 <span id="product-count">0</span>개)</span>
                    <select>
                        <option>최근주문순</option>
                    </select>
                    <select>
                        <option>100개씩 보기</option>
                    </select>
                </div>
                <button class="btn-secondary">조회항목 설정</button>
            </div>
            <div class="table-container">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>상품번호</th>
                            <th>상품명</th>
                            <th>태그</th>
                            <th>재고</th>
                            <th>등록일</th>
                            <th>판매상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <!-- JavaScript에서 데이터 로드 -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="table-footer">
            <p>• 배송정보(배송방법/택배사/송장번호)가 등록된 주문 건의 경우 한 번에 정보를 일괄적용 수 있습니다.</p>
            <p>• 배송정보를 선택 후 주문 목록 상단/하단의 [발송처리] 버튼을 누르시면 처음 처리가 진행됩니다.</p>
            <p>• 송장번호의 수정이 필요하신 경우 아래의 주문 목록에서 대상 제품 선택 후 정보 수정을 하신 [송장수정] 버튼을 클릭하시면 수정 창이 제공됩니다.</p>
        </div>
    </div>
    <script src="/js/dashboard/product-management.js" async></script>
</body>

</html>
