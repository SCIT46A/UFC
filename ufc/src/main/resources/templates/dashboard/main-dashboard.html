<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크리에이터 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f7fb;
            color: var(--gray-800);
            line-height: 1.6;
        }

        /* 
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        } */

        .dashboard-header {
            margin-bottom: 24px;
        }

        .dashboard-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .dashboard-subtitle {
            font-size: 16px;
            color: var(--gray-600);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease-in-out;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-title {
            font-size: 14px;
            color: var(--gray-600);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-change {
            font-size: 12px;
            display: flex;
            align-items: center;
        }

        .stat-change.positive {
            color: #22c55e;
        }

        .stat-change.negative {
            color: #ef4444;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .chart-subtitle {
            font-size: 14px;
            color: var(--gray-600);
            margin-top: 4px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .chart-container.small {
            height: 250px;
        }
    </style>
</head>

<body>
    <div th:fragment="main-dashboard">
        <input type="hidden" id="creatorId" th:value="${creatorId}">
        <div class="content-wrapper">
            <div class="dashboard-header">

            <!-- Stats Cards -->
            <div class="stats-grid">

                </div>
                <div class="stat-card">

                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="campaignChart"></canvas>

                </div>
                <div class="chart-card">

                    </div>
                    <div class="chart-container">
                        <canvas id="ordersChart"></canvas>

                </div>
            </div>

            <!-- Charts - Second Row -->
            <div class="chart-grid">
                <div class="chart-card">
                    <div class="chart-header">
                        <div>
                            <h2 class="chart-title">매출 개요</h2>
                            <p class="chart-subtitle">지난 30일간의 매출 추이</p>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
                <!-- <div class="chart-card">
                <div class="chart-header">

                    </div>
                </div>
                <div class="chart-container small">
                    <canvas id="audienceChart"></canvas>
                </div>
            </div> -->
                <div class="chart-card">
                    <div class="chart-header">
                        <div>
                            <h2 class="chart-title">상품 판매 비율</h2>
                            <p class="chart-subtitle">상품별 판매 비율</p>
                        </div>
                    </div>
                    <div class="chart-container small">
                        <canvas id="productChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Charts - Third Row -->
            <div class="chart-grid">
                <!-- <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <h2 class="chart-title">참여도 지표</h2>
                        <p class="chart-subtitle">콘텐츠 유형별 참여도 비교</p>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="engagementChart"></canvas>
                </div>
            </div> -->
                <!-- <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <h2 class="chart-title">상품 판매 비율</h2>
                        <p class="chart-subtitle">상품별 판매 비율</p>
                    </div>
                </div>
                <div class="chart-container small">
                    <canvas id="productChart"></canvas>
                </div>
            </div> -->
            </div>
        </div>
    </div>
