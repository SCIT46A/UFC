<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 로고 만들어지면 href수정 -->
    <link
            rel="icon"
            th:href="@{/images/fix/favicon.png}"
            type="image/png"
    />
    <link
            rel="stylesheet"
            th:href="@{/css/admin-user.css}"
            href="../../static/css/admin/admin-user.css"
    />

    <title>UP-DA :: 관리자 로그인 페이지</title>
</head>
<body>
<h2>[관리자 로그인 페이지]</h2>
<!-- 로그인 화면 -->
<div class="content">
    <form th:action="@{/user/loginProc}" method="POST" id="loginForm">
        <div class="section pointColor">
            <div class="article">
                <ul>
                    <li>
                        <i class="fa-solid fa-fingerprint"></i>
                        <input type="text" name="userId" id="userId" placeholder="ID 입력">
                        <div id="confirmId" style="font-size: 0.8em;"></div>
                    </li>
                    <li>
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="userPwd" id="userPwd" placeholder="Password 입력">
                        <div id="confirmPwd" style="font-size: 0.8em;"></div>
                    </li>
                </ul>
                <th:block th:if="${error}">
                    <div th:text="${errMessage}" style="color:red; font-size: 0.8em;"></div>
                </th:block>

                <div class="btns">
                    <input type="button" id="submitBtn" value="로그인" class="btn btn-primary">
                    <input type="button" id="resetBtn" value="초기화" class="btn btn-lignt">
                </div>
            </div>
        </div>

    </form>
</div>

</body>
</html>
