<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" th:href="@{/css/admin/admin-user.css}" />

    <!-- 파비콘 설정 -->
    <link rel="icon" th:href="@{/images/fix/favicon.png}" type="image/png" />
    <title>UP-DA :: 관리자 페이지</title>
</head>
<body>

<!-- 헤더 -->
<header class="header-all">
    <div class="header-logo-text">
        <a href="" class="header-logo">
            <img class="header-logo-icon" th:src="@{/images/fix/logo.png}" alt="로고" />
        </a>
        <div class="header-slash">|</div>
        <div class="header-admin-text">
            <span>Admin Center</span>
        </div>
    </div>
</header>

<main class="main-all">
    <!-- 좌측 메뉴 -->
    <nav class="main-nav-wrap">
        <div class="main-admin-info">
            <div class="main-admin-wrap">
                <div class="main-admin-container">
                    <button class="main-admin-button">
                        <div class="main-admin-image-warp"></div>
                    </button>
                </div>
                <h2 class="main-admin-name">UP-DA</h2>
                <a href="" class="main-admin-logout">
                    <button class="main-admin-logout-button">
                        <div class="main-admin-logout-warp">
                            <div>로그아웃</div>
                        </div>
                    </button>
                </a>
            </div>
        </div>

        <ul class="main-admin-select">
            <li class="main-user"><a href="javascript:void(0);" data-page="campaign-status">캠페인 운영 현황</a></li>
            <li class="main-user-other"><a href="javascript:void(0);" data-page="creator-approval">창작자 승인 대기</a></li>
            <li class="main-user-other"><a href="javascript:void(0);" data-page="creator-status">창작자 현황</a></li>
            <li class="main-user-other"><a href="javascript:void(0);" data-page="creator-report">창작자 신고 관리</a></li>
            <li class="main-user-other"><a href="javascript:void(0);" data-page="user-report">유저 신고 관리</a></li>
            <li class="main-user-other"><a href="javascript:void(0);" data-page="notice">공지사항 관리</a></li>
        </ul>
    </nav>

    <!-- 로딩 화면을 Thymeleaf에서 직접 삽입 -->
    <div id="loading-container" th:replace="~{admin/loading}"></div>


    <!-- 🔥 오른쪽 컨텐츠 영역 -->
    <div class="content" id="content">
        <h2>관리 시스템</h2>
        <p>좌측 메뉴에서 항목을 선택하세요.</p>
    </div>
</main>

<script th:src="@{/js/admin/admin-user.js}" defer></script>

</body>
</html>
