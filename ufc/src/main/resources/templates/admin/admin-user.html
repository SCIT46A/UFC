<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" th:href="@{/css/admin/admin-user.css}" />

    <!-- 파비콘 설정 -->
    <link rel="icon" th:href="@{/images/fix/favicon.png}" type="image/png" />
    <title>UP-DA :: 관리자 페이지</title>

</head>
<body>
<!-- 헤더 먼저 해야합니다. 나중에 색상은 바꿔야합니다! -->
<header class="header-all">
    <div class="header-logo-text">
        <a href="" class="header-logo">
            <img class="header-logo-icon" th:src="@{/images/fix/logo.png}" alt="로고" />
        </a>
        <div class="header-slash">|</div>
        <div class="header-admin-text">
            <span>Admin Center</span>
        </div>
    </div>
</header>
<!-- 헤더  끝 좌측 안내부분 시작 -->
<main class="main-all">
    <!-- 공통으로 들어가는 좌측부분 -->
    <nav class="main-nav-wrap">
        <!-- 위에 로그인 정보 및 로그아웃 칸 -->
        <div class="main-admin-info">
            <div class="main-admin-wrap">
                <div class="main-admin-container">
                    <button class="main-admin-button">

                        <div class="main-admin-image-warp"></div>
                    </button>
                </div>
                <h2 class="main-admin-name">UP-DA</h2>
                <a href="" class="main-admin-logout">
                    <button class="main-admin-logout-button">
                        <div class="main-admin-logout-warp">
                            <div>로그아웃</div>
                        </div>
                    </button>
                </a>
            </div>
        </div>
        <!-- 메뉴 선택할수 있는 칸 -->
        <ul class="main-admin-select">
            <!-- 캠페인 운영 현황 -->
            <li class="main-user">
                <a href="javascript:void(0);"
                   data-page="campaign-status">캠페인 운영 현황</a>
            </li>
            <!-- 캠페인 신고 관리 -->
            <li class="main-user-other">
                <a href="javascript:void(0);"
                   data-page="campaign-report">캠페인 신고 관리</a>
            </li>
            <!-- 창작자 승인 대기 -->
            <li class="main-user-other">
                <a href="javascript:void(0);"
                   data-page="creator-approval">창작자 승인 대기</a>
            </li>
            <!-- 창작자 현황 -->
            <li class="main-user-other">
                <a href="javascript:void(0);"
                   data-page="creator-status">창작자 현황</a>
            </li>
            <!-- 유저 신고 관리 -->
            <li class="main-user-other">
                <a href="javascript:void(0);"
                   data-page="user-report">유저 신고 관리</a>
            </li>
            <!-- 공지사항 관리 -->
            <li class="main-user-other">
                <a href="javascript:void(0);"
                   data-page="notice">공지사항 관리</a>

            </li>
        </ul>
    </nav>
    <!-- 사실상 여기만 수정하면 모든게 끝입니다! -->
    <!-- 오른쪽 컨텐츠 영역 -->
    <div class="content" id="content">
        <h2>관리 시스템</h2>
        <p>좌측 메뉴에서 항목을 선택하세요.</p>
    </div>
</main>

<!-- JavaScript 파일 연결 -->
<script th:src="@{/js/admin/admin-user.js}" defer></script>


</body>
</html>
