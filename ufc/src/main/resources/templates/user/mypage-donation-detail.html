<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UP-DA :: 내가 후원한 캠페인 상세정보</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
    <link rel="stylesheet" href="http://code.jquery.com/ui/1.8.18/themes/base/jquery-ui.css" type="text/css" />
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
        <script src="http://code.jquery.com/ui/1.8.18/jquery-ui.min.js"></script>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css" />
        <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" th:href="@{/images/fix/favicon.png}" type="image/png" />
    <link
      rel="stylesheet"
      th:href="@{/css/user/mypage-donation-detail.css}"
      href="../../static/css/user/mypage-donation-detail.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/fix/header.css}"
      href="../../static/css/fix/header.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/fix/footer.css}"
      href="../../static/css/fix/footer.css"
    />
    <script th:src="@{/js/fix/header.js}" defer></script>
    <script th:src="@{/js/user/mypage-donation-detail.js}" defer></script>
  </head>
  <body>
    <div th:replace="~{fix/header :: header}"></div>
    <main>
      <section id="projects" style="background-color: #ffffff">
        
        <div class="container mx-auto px-4 target-project">
          <!-- 배송 상태 조회 (안보임) -->
          <div class="main-in-mi-content-box" style="display: none;">
                    <div class="main-in-mi-content-box-title">
                      <p class="main-in-mi-content-box-title-le">배송 상태</p>
                    </div>
                    <form th:action="@{/user/donation/detail/{donationId}(donationId=${donation.donationId})}" method="post">
                      <div class="main-in-mi-content-box-content">
                        <dl class="main-in-mi-content-box-content-in">
                          <dt>택배사 Id</dt>
                          <dd> <input type="text" name="courierId" id="courierId"></dd>
                        </dl>
                        <dl class="main-in-mi-content-box-content-in">
                          <dt>운송장 번호</dt>
                          <dd> <input type="text" name="trackingNumber" id="trackingNumber"></dd>
                        </dl>
                        <dl class="main-in-mi-content-box-content-in">
                          <dd> <button type="submit">조회</button></dd>
                        </dl>
                        <dl>
                          <dt>
                            배송 상태
                          </dt>
                          <dd class="result" th:if="${status != null}">
                            <p id="status" th:text="${status}"></p>
                          </dd>
                        </dl>
                      </div>
                    </form>
                  </div>
                  <!-- 주목할 만한 프로젝트 -->
          <div class="main">
            <div class="main-in">
              <!-- 상단 캠페인 내용 -->
              <section class="main-in-top">
                <div class="main-in-top-box">
                  <div class="main-in-top-box-img">
                    <a th:href="@{/campaign/{id}(id=${campaign.campaignId})}">
                      <img
                        th:src="${imageUrl}"
                        alt=""
                      />
                    </a>
                  </div>
                  <div class="main-in-top-box-content">
                    <!-- <span class="main-in-top-box-content-top"
                      >캐릭터 · 굿즈</span
                    > -->
                    <h3 class="main-in-top-box-content-mi">
                      <a th:href="@{/campaign/{id}(id=${campaign.campaignId})}"
                      th:text="${campaign.title}"
                      >일하기 싫은 직장인 그 자체 +모지 키링+</a>
                    </h3>
                    <div class="main-in-top-box-content-bo">
                      <strong th:text="${donation.material.name}"></strong> 
                      <span th:text="${donation.quantity}"></span>개        
                      <span style="margin-left: 10px;" class="main-in-top-box-content-bo-mi" th:text="${achievement}"></span>% 달성
                    </div>
                  </div>
                </div>
              </section>
              <!-- 내 구매 내역 -->
              <div class="main-in-mi">
                <!-- 내용 -->
                <div class="main-in-mi-content">
                  <!-- 사실상 여기 반복 -->
                  <div class="main-in-mi-content-box">
                    <div class="main-in-mi-content-box-title">
                      <p class="main-in-mi-content-box-title-le">기부 정보</p>
                    </div>
                    <div class="main-in-mi-content-box-content">
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>캠페인 상태</dt>
                        <dd class="add" th:text="${achievement >= 100 ? '달성' : '미달성'}"></dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>물품 확인</dt>
                        <dd class="add" 
                          th:switch="${donation.status}">
                          <p th:case="'approved'">확인 완료 :)</p>
                          <p th:case="'rejected'">거절되었어요</p>
                          <p th:case="'pending'">검토중입니다. 조금만 기다려주세요</p>
                        </dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>후원 날짜</dt>
                        <dd th:text="${#temporals.format(donation.donatedDate, 'yyyy.MM.dd')}"></dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>펀딩 마감일</dt>
                        <dd th:text="${#temporals.format(campaign.endDate, 'yyyy.MM.dd')}"></dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>기부 품목</dt>
                        <dd>

                          <span class="add" th:text="${donation.material.name}" style="margin-right: 10px;"></span>
                          <span class="add" th:text="${donation.quantity}"></span>
                          <span>개</span> 
                        </dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>선택 리워드</dt>
                        <dd th:text="${rewardName} !=null ? ${rewardName} : '기부된 품목입니다 :)'"></dd>
                      </dl>
                    </div>
                  </div>
                  <!-- 배송 정보 -->
                  <div class="main-in-mi-content-box" th:if="${reward != null}">
                    <div class="main-in-mi-content-box-title">
                      <p class="main-in-mi-content-box-title-le" >배송 정보</p>
                    </div>
                    <div class="main-in-mi-content-box-content">
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>받는 사람</dt>
                        <dd th:text="${user.userName}"></dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>연락처</dt>
                        <dd th:text="${user.phoneNumber}"></dd>
                      </dl>
                      <dl  class="main-in-mi-content-box-content-in">
                        <dt>주소</dt>
                        <dd id = "address" th:text="${user.userAddress}"></dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>송장번호</dt>
                          <dd id="courierName" 
                              th:text="${reward.invoice != null ? reward.invoice : '배송을 준비중이니 조금 기다려 주세요 :)'}">
                          </dd>
                      </dl>
                      <dl class="main-in-mi-content-box-content-in">
                        <dt>배송 상태</dt>
                        <dd id="deliveryStatus"></dd>
                      </dl>
                    </div>
                  </div>
                  <!-- 배송 상태 조회 -->
                  
                </div>
                <!-- 밑에 버튼 -->
                <div class="main-in-mi-content-box-btn1">
                  <a th:href="@{/user/donation/certificate/{donationId}(donationId=${donation.donationId})}" target="_blank">
                    <button class="main-in-mi-content-box-btn-proof">
                      후원 증서 출력
                    </button>
                  </a>
                </div>
                <div class="main-in-mi-content-box-btn2">
                  <a th:href="@{/user/donation}">
                    <button class="main-in-mi-content-box-btn-in">
                      후원 목록 보기
                    </button>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div th:replace="~{fix/footer :: footer}"></div>
  </body>
</html>
