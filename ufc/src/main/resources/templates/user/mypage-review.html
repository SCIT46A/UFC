<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UP-DA :: 작성한 후기</title>
    <link
      rel="stylesheet"
    />
    <link rel="stylesheet" href="http://code.jquery.com/ui/1.8.18/themes/base/jquery-ui.css" type="text/css" />
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
        <script src="http://code.jquery.com/ui/1.8.18/jquery-ui.min.js"></script>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css" />
        <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
        <link
            rel="icon"
            th:href="@{/images/fix/favicon.png}"
            type="image/png"
        />
        <link
            rel="stylesheet"
            th:href="@{/css/user/mypage-review.css}"
            href="../../static/css/user/mypage-review.css"
        />
        <link
            rel="stylesheet"
            th:href="@{/css/fix/header.css}"
            href="../../static/css/fix/header.css"
        />
        <link
            rel="stylesheet"
            th:href="@{/css/fix/footer.css}"
            href="../../static/css/fix/footer.css"
        />
    <script th:src="@{/js/fix/header.js}" defer></script>
    <script th:src="@{/js/user/mypage-review.js}" defer></script>
  </head>
  <body>

    <div th:replace="~{fix/header :: header}"></div>
    <main>
      <section id="projects" style="background-color: #ffffff">
        <!-- 주목할 만한 프로젝트 -->
        <div class="container mx-auto px-4 target-project">
          <div class="main">
            <div class="main-in">
              <!-- 공용으로 들어가는 상단 -->
              <div class="main-in-box">
                  <!-- 프로필쪽 -->
                  <div class="main-in-box-pro">
                      <div class="main-in-box-pro-le">
                          <div class="main-in-box-pro-le-in">
                              <img
                                  th:src="${userImageId}"
                                  alt=""
                                  class="main-in-box-pro-le-in-img"
                              />
                              <div
                                  class="main-in-box-pro-le-in-box"
                              >
                                  <div
                                      class="main-in-box-pro-le-in-box-title"
                                  >
                                      <div
                                          class="main-in-box-pro-le-in-box-title-in"
                                      >
                                          <span th:text="${user.userName}">up-da</span>
                                      </div>
                                  </div>
                                  <div
                                      class="main-in-box-pro-le-in-box-content"
                                  >
                                      <div
                                          class="main-in-box-pro-le-in-box-content-box"
                                      >
                                          <div
                                              class="main-in-box-pro-le-in-box-content-box-in"
                                          >
                                              <a
                                                  class="main-in-box-pro-le-in-box-content-box-in-top"
                                                  th:href="@{/user/like(tab='creator')}"
                                              >
                                                  팔로잉
                                                  <svg
                                                      class="Styled__StyledIconChevronRight-sc-15jatcm-8 kdRksf"
                                                      width="18"
                                                      height="18"
                                                      viewBox="0 0 18 18"
                                                      fill="none"
                                                      xmlns="http://www.w3.org/2000/svg"
                                                  >
                                                      <path
                                                          fill-rule="evenodd"
                                                          clip-rule="evenodd"
                                                          d="M13.5 9L7.87504 15L6.75 13.7999L11.2499 9L6.75 4.20005L7.87504 3L13.5 9Z"
                                                          fill="#545454"
                                                      ></path>
                                                  </svg>
                                              </a>
                                              <a
                                                  th:href="@{/user/like(tab='creator')}"
                                                  class="main-in-box-pro-le-in-box-content-box-in-bo"
                                              >
                                                  <span th:text="${creatorLikes}"></span>
                                              </a>
                                          </div>
                                          <div
                                              class="main-in-box-pro-le-in-box-content-box-in"
                                          >
                                              <a
                                                  class="main-in-box-pro-le-in-box-content-box-in-top"
                                                  th:href="@{/user/donation}"
                                              >
                                                  후원수
                                                  <svg
                                                      class="Styled__StyledIconChevronRight-sc-15jatcm-8 kdRksf"
                                                      width="18"
                                                      height="18"
                                                      viewBox="0 0 18 18"
                                                      fill="none"
                                                      xmlns="http://www.w3.org/2000/svg"
                                                  >
                                                      <path
                                                          fill-rule="evenodd"
                                                          clip-rule="evenodd"
                                                          d="M13.5 9L7.87504 15L6.75 13.7999L11.2499 9L6.75 4.20005L7.87504 3L13.5 9Z"
                                                          fill="#545454"
                                                      ></path>
                                                  </svg>
                                              </a>
                                              <a
                                                  class="main-in-box-pro-le-in-box-content-box-in-bo"
                                                  th:href="@{/user/donation}"
                                              >
                                                  <span th:text="${donationCount}"></span>
                                              </a>
                                          </div>
                                      </div>
                                  </div>
                              </div>
                          </div>

                      </div>
                  </div>
                  <!-- 내비게이션바 -->
                  <div class="main-in-box-na">
                      <div class="main-in-box-na-box">
                          <div class="main-in-box-na-box-pe">
                          <span class="main-in-box-na-box-pe-span ">
                              <div class="main-in-box-na-box-pe-span-in">
                              <a 
                              href="/src/main/resources/templates/user/mypage-profile.html"
                              th:href="@{/user}"
                              >프로필</a>
                              </div>
                          </span>
                          <span class="main-in-box-na-box-pe-span current">
                              <div class="main-in-box-na-box-pe-span-in">
                              <a 
                              href="/src/main/resources/templates/user/mypage-review.html"
                              th:href="@{/user/review}"
                              >작성한 후기</a>
                              </div>
                          </span>
                          <span class="main-in-box-na-box-pe-span">
                              <div class="main-in-box-na-box-pe-span-in">
                              <a 
                              href="/src/main/resources/templates/user/mypage-donation.html"
                              th:href="@{/user/donation}"
                              >내가 후원한 캠페인</a>
                              </div>
                          </span>
                          <span class="main-in-box-na-box-pe-span ">
                              <div class="main-in-box-na-box-pe-span-in ">
                              <a 
                              href="/src/main/resources/templates/user/mypage-like.html"
                              th:href="@{/user/like}"
                              >좋아요</a>
                              </div>
                          </span>
                          <span class="main-in-box-na-box-pe-span">
                              <div class="main-in-box-na-box-pe-span-in">
                              <a
                              href="/src/main/resources/templates/user/mypage-badge.html"
                              th:href="@{/user/badge}"
                              >뱃지</a>
                              </div>
                          </span>
                          <span class="main-in-box-na-box-pe-span ">
                              <div class="main-in-box-na-box-pe-span-in">
                              <a
                              href="/src/main/resources/templates/user/mypage-buy.html"
                              th:href="@{/user/buy}"
                              >구매내역</a>
                              </div>
                          </span>
                          </div>
                      </div>
                      </div>
                  </div>

              </div>
            <!-- 각각의 나올것들 -->
            <div class="content-box">
              <!-- 헤더? -->
              <div class="content-box-top">
                <div class="content-box-top-title">작성한 후기</div>
                <div class="content-box-top-count">
                  <span th:text="${reviewCount}"></span>
                </div>
              </div>
              <!-- 내용들 -->
              <div>
                <!-- 각각의 내용들 들어감 -->
                <div
                  class="content-box-in"
                  th:each="campaignReview, status : ${paging.content}"
                >
                  <!-- 유저 -->
                   <a href=""></a>
                  <div class="content-box-in-user">
                    <div class="content-box-in-user-box">
                      <!-- 캠페인 -->
                      <div class="content-box-in-cam">
                        <!-- 나중에 작업할 내용 -->
                        <a
                          th:href="@{/campaign/{campaignId}(campaignId=${campaignReview.campaignedBy.campaignId})}"
                          class="content-box-in-cam-in"
                        >
                          <img
                            th:src="${imageUrls[status.index]}"
                            alt=""
                          />
                          <div th:text="${campaignReview.campaignedBy.title}">
                            <!-- 캠페인 제목 -->
                          </div>
                        </a>
                      </div>
                    </div>
                    <div class="content-box-in-user-btn report-menu">
                      <div class="content-box-in-user-btn-in">
                        <div class="content-box-in-user-btn-in-warp">
                          
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- 내용 -->
                   <div 
                    class="content-box-in-content" 
                    th:text="${campaignReview.content != null ? campaignReview.content : '내용이 없습니다.'}">
                    <!-- 리뷰 내용 -->
                  </div>

                  <!-- 날짜 -->
                  <div class="content-box-in-date">
                    <div class="content-box-in-date-in">
                      <div class="content-box-in-date-in-time">
                        <span th:text="${campaignReview.createdDate}"></span>
                      </div>
                    </div>
                  </div>
                </div>
                  <div class="content-box-bo">
                    <div class="content-box-bo-box">
                        <ul class="pagination">
                            <!-- 이전 버튼 -->
                            <li th:if="${paging.hasPrevious()}">
                                <a th:href="@{/user/review(page=${paging.number - 1}, size=${paging.size})}" 
                                  class="btn-choice">이전</a>
                            </li>

                            <!-- 페이지 번호 목록 -->
                            <li th:each="i : ${#numbers.sequence(0, paging.totalPages - 1)}">
                                <a th:href="@{/user/review(page=${i}, size=${paging.size})}"
                                  th:text="${i + 1}"
                                  th:classappend="${i == paging.number} ? 'active' : ''"></a>
                            </li>

                            <!-- 다음 버튼 -->
                            <li th:if="${paging.hasNext()}">
                                <a th:href="@{/user/review(page=${paging.number + 1}, size=${paging.size})}" 
                                  class="btn-choice">다음</a>
                            </li>
                        </ul>
                    </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
</div>
    <div th:replace="~{fix/footer :: footer}"></div>
        <div class="black-ctn hidden">

  </div>
  </body>

</html>
