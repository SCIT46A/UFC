<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UP-DA :: 마이페이지</title>
    <link
      rel="stylesheet"
    />
    <link rel="stylesheet" href="http://code.jquery.com/ui/1.8.18/themes/base/jquery-ui.css" type="text/css" />
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
        <script src="http://code.jquery.com/ui/1.8.18/jquery-ui.min.js"></script>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css" />
        <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" th:href="@{/images/fix/favicon.png}" type="image/png" />
    <link
      rel="stylesheet"
      th:href="@{/css/fix/header.css}"
      href="../../static/css/fix/header.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/user/mypage-profile.css}"
      href="../../static/css/user/mypage-profile.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/fix/footer.css}"
      href="../../static/css/fix/footer.css"
    />
    <script th:src="@{/js/fix/header.js}" defer></script>
    <script th:src="@{/js/user/mypage-profile.js}" defer></script>
  </head>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <body>
    <div th:replace="~{fix/header :: header}"></div>
    <main>
      <section id="projects" style="background-color: #ffffff">
        <!-- 주목할 만한 프로젝트 -->
        <div class="container target-project">
          <div class="main">
            <div class="main-in">
              <!-- 공용으로 들어가는 상단 -->
              <div class="main-in-box">
                <!-- 프로필쪽 -->
                <div class="main-in-box-pro">
                  <div class="main-in-box-pro-le">
                    <div class="main-in-box-pro-le-in">
                      <img
                        src="/images/user/default_avatar.png" 
                        th:src="${imageUrls[0]}"
                        alt=""
                        class="main-in-box-pro-le-in-img"
                      />
                      <div class="main-in-box-pro-le-in-box">
                        <div class="main-in-box-pro-le-in-box-title">
                          <div class="main-in-box-pro-le-in-box-title-in">
                            <span th:text="${user.userName}">up-da</span>
                          </div>
                        </div>
                        <div class="main-in-box-pro-le-in-box-content">
                          <div class="main-in-box-pro-le-in-box-content-box">
                            <div
                              class="main-in-box-pro-le-in-box-content-box-in"
                            >
                              <div
                                class="main-in-box-pro-le-in-box-content-box-in-top"
                              >
                                팔로잉
                                <svg
                                  class="Styled__StyledIconChevronRight-sc-15jatcm-8 kdRksf"
                                  width="18"
                                  height="18"
                                  viewBox="0 0 18 18"
                                  fill="none"
                                  xmlns="http://www.w3.org/2000/svg"
                                >
                                  <path
                                    fill-rule="evenodd"
                                    clip-rule="evenodd"
                                    d="M13.5 9L7.87504 15L6.75 13.7999L11.2499 9L6.75 4.20005L7.87504 3L13.5 9Z"
                                    fill="#545454"
                                  ></path>
                                </svg>
                              </div>
                              <div
                                class="main-in-box-pro-le-in-box-content-box-in-bo"
                              >
                                -
                              </div>
                            </div>
                            <div
                              class="main-in-box-pro-le-in-box-content-box-in"
                            >
                              <div
                                class="main-in-box-pro-le-in-box-content-box-in-top"
                              >
                                후원수
                                <svg
                                  class="Styled__StyledIconChevronRight-sc-15jatcm-8 kdRksf"
                                  width="18"
                                  height="18"
                                  viewBox="0 0 18 18"
                                  fill="none"
                                  xmlns="http://www.w3.org/2000/svg"
                                >
                                  <path
                                    fill-rule="evenodd"
                                    clip-rule="evenodd"
                                    d="M13.5 9L7.87504 15L6.75 13.7999L11.2499 9L6.75 4.20005L7.87504 3L13.5 9Z"
                                    fill="#545454"
                                  ></path>
                                </svg>
                              </div>
                              <div
                                class="main-in-box-pro-le-in-box-content-box-in-bo"
                              >
                                -
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <!-- <div class="main-in-box-pro-btn">
                        <form th:action="@{/user/edit}" method="get">

                            <button
                            class="main-in-box-pro-btn-in"
                            
                            >

                        프로필 편집
                      </button>
                      </form>
                    </div> -->
                  </div>
                </div>
                <!-- 내비게이션바 -->
                <div class="main-in-box-na">
                  <div class="main-in-box-na-box">
                    <div class="main-in-box-na-box-pe">
                      <span class="main-in-box-na-box-pe-span current">
                        <div class="main-in-box-na-box-pe-span-in">
                          <a 
                          href="/src/main/resources/templates/user/mypage-profile.html"
                          th:href="@{/user}"
                          >프로필</a>
                        </div>
                      </span>
                      <span class="main-in-box-na-box-pe-span">
                        <div class="main-in-box-na-box-pe-span-in">
                          <a 
                          href="/src/main/resources/templates/user/mypage-review.html"
                          th:href="@{/user/review}"
                          >작성한 후기</a>
                        </div>
                      </span>
                      <span class="main-in-box-na-box-pe-span">
                        <div class="main-in-box-na-box-pe-span-in">
                          <a 
                          href="/src/main/resources/templates/user/mypage-donation.html"
                          th:href="@{/user/donation}"
                          >내가 후원한 캠페인</a>
                        </div>
                      </span>
                      <span class="main-in-box-na-box-pe-span">
                        <div class="main-in-box-na-box-pe-span-in">
                          <a 
                          href="/src/main/resources/templates/user/mypage-like.html"
                          th:href="@{/user/like}"
                          >좋아요 누른 캠페인</a>
                        </div>
                      </span>
                      <span class="main-in-box-na-box-pe-span">
                        <div class="main-in-box-na-box-pe-span-in">
                          <a
                          href="/src/main/resources/templates/user/mypage-badge.html"
                          th:href="@{/user/badge}"
                          >뱃지</a>
                        </div>
                      </span>
                    </div>
                  </div>
                </div>
              </div>
              <!-- 각각의 나올것들 -->
               <form th:action="@{/user/userUpdate}" method="post" enctype="multipart/form-data">
                  <div class="main-in-content">
                    <div class="main-in-content-in">
                      <!-- 각각의 div  -->
                      <div class="main-in-content-in-pe">
                        <!-- 상단 -->
                        <div class="main-in-content-in-pe-title">
                          <p>프로필 사진</p>
                          <button type="button" class="pro-edit-btn">프로필 변경하기</button>
                          <input type="submit" class="pro-edit-btn-save hidden" value="저장">
                        </div>
                        <!-- 아래 내용 -->
                        <div class="main-in-content-in-pe-content pro-img">
                          <div class="main-in-content-in-pe-content-in">
                            <!-- 수정 필요 사이즈 -->
                            <img class="main-in-content-in-pe-content-in-img" th:src="${imageUrls[0]}"></img>
                          </div>
                        </div>
                        <!-- 버튼 눌렀을때 -->
                        <div class="pro-img-close hidden">
                          <div class="ch-img">
                            <div>
                              <div class="ch-img-box">
                                <div class="ch-img-box-in">
                                  <div class="ch-img-box-in-warp" id="previewImage">
                                    <img th:src="${imageUrls[0]}" style="width: 100%; height: 100%; object-fit: cover;" alt="" class="target-img">
                                  </div>
                                </div>
                              </div>
                            </div>
                            <div class="ch-img-text">
                              <div>
                                <div class="ch-img-text-in">
                                    <span>
                                      <input type="file" class="hidden" name="profileImage" id="ch-img-btn" accept="image/*"/>
                                      <label class="ch-img-btn-label" for="ch-img-btn" style="margin-top: 10px;">파일 업로드</label>
                                      <!-- DB 기본키(photo.id) – 보통 서버에서 조회해서 채워짐 -->
                                      <input type="hidden" id="imageIdField" name="photo.id">
                                      <!-- 클라우드플레어 이미지 ID (UUID 문자열)를 전송할 필드 -->
                                      <input type="hidden" id="imageInputField-add" name="photo.imageId">
                                    </span>
                                </div>
                                <div class="ch-img-text-content">
                                  250 x 250 픽셀에 최적화되어 있으며, 5MB 이하의
                                  JPG, GIF, PNG 파일을 지원합니다.
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <!-- 이름 -->
                      <div class="main-in-content-in-pe">
                        <!-- 상단 -->
                        <div class="main-in-content-in-pe-title">
                          <p>이름</p>
                        </div>
                        <!-- 아래 내용 -->
                        <div class="pro-name" th:text="${user.userName}">
                          
                        </div>
                        <!-- 버튼 눌렀을때 -->
                        <div class="pro-name-close hidden">
                          <div>
                            <div class="name-in">
                              <span class="name-in-span">
                                <input
                                  type="text"
                                  name="userName"
                                  placeholder="이름을 입력해주세요."
                                  class="name-input"
                                  th:value="${user.userName}"
                                />
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                      <!-- 소개 -->
                      <div class="main-in-content-in-pe">
                        <!-- 상단 -->
                        <div class="main-in-content-in-pe-title">
                          <p>소개</p>
                        </div>
                        <!-- 아래 내용 -->
                        <div class="pro-sh" th:text="${user.intro}">
                        </div>
                        <!-- 버튼 눌렀을때 -->
                        <div class="pro-sh-close hidden">
                          <div>
                            <div class="name-in-span-text">
                              <textarea
                                class="info-textarea"
                                type="text"
                                placeholder="소개를 입력해주세요."
                                th:text="${user.intro}"
                                name="intro"
                              ></textarea>
                            </div>
                          </div>
                        </div>
                      </div>
                      <!-- 연락처 -->
                      <div class="main-in-content-in-pe">
                        <!-- 상단 -->
                        <div class="main-in-content-in-pe-title">
                          <p>연락처</p>
                        </div>
                        <!-- 아래 내용 -->
                        <div class="pro-ph" th:text="${user.phoneNumber}">
                          010-1234-4231
                        </div>
                        <!-- 버튼 눌렀을때 -->
                        <div class="pro-ph-close hidden">
                          <div>
                            <div class="name-in">
                              <span class="name-in-span">
                                <!-- 수정 필요  -->
                                <input
                                  type="text"
                                  name="phoneNumber"
                                  oninput="autoHyphen2(this)"
                                  maxlength="13"
                                  placeholder="번호를 입력해주세요"
                                  th:value="${user.phoneNumber}"
                                  class="name-input"
                                />
                                <span class="phone-error"></span>
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                      <!-- 주소 -->
                      <div class="main-in-content-in-pe">
                        <!-- 상단 -->
                        <div class="main-in-content-in-pe-title">
                          <p>주소</p>
                        </div>
                        <!-- 아래 내용 -->
                         
                        <div class="pro-ad" th:text="${user.userAddress}">
                          코엑스 어딘가
                        </div>
                        <!-- 버튼 눌렀을때 -->
                        <div class="pro-ad-close hidden">
                          <div>
                            <div class="name-in">
                              <span class="name-in-span">
                                <div style="display: flex">
                                  <input
                                    type="text"
                                    name="nickname"
                                    class="input name-input address"
                                    style="width: 400px"
                                    th:value="${#strings.arraySplit(user.userAddress, '#')[0]}"
                                    readonly
                                  />
                                  <button
                                    type="button"
                                    class="bun-test"
                                    onclick="execPostCode()"
                                  >검색
                                    </button> 
                                    </div>
                                <!-- <input
                                  type="text"
                                  placeholder="주소를 입력해주세요."
                                  th:value="${user.userAddress}"
                                /> -->
                              </span>
                            </div>
                            <div class="name-container">
                              <div class="name-content">
                                <div class="main-in-content-in-pe-title">
                                  <p>상세주소</p>
                                </div>
                                <input
                                  type="text"
                                  class="input address-detail"
                                  placeholder="상세주소를 입력해주세요."
                                  th:value="${#strings.arraySplit(user.userAddress, '#')[1]}"
                                />
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <input type="hidden" class="total-add" name="userAddress" />
                      <!-- 회원탈퇴 -->
                      <div class="main-in-content-in-pe-un">
                        <!-- 상단 -->
                        <div class="main-in-content-in-pe-title-un">
                          <a th:href="@{/user/delete(userId=${user.userId})}"
                            >회원탈퇴</a
                          >
                        </div>
                      </div>
                    </div>
                    <!-- 오른쪽 -->
                    <div class="edit-ri">
                      <p>어떤 정보가 프로필에 공개되나요?</p>
                      <div class="edit-ri-box">
                        프로필 사진과 이름, URL, 소개글, 웹사이트가 프로필 페이지에
                        공개 됩니다.
                        <span
                          ><a
                            href="/src/main/resources/templates/user/profile.html"
                            th:href="@{/user/mypage-profile}"
                            >내 프로필 바로가기</a
                          ></span>
                      </div>
                    </div>
                  </div>
                   </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div th:replace="~{fix/footer :: footer}"></div>
  </body>
</html>
