<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UP-DA :: 내가 후원한 캠페인 상세정보</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
    <link rel="stylesheet" href="http://code.jquery.com/ui/1.8.18/themes/base/jquery-ui.css" type="text/css" />
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
        <script src="http://code.jquery.com/ui/1.8.18/jquery-ui.min.js"></script>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css" />
        <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      th:href="@{/css/user/mypage-donation-detail.css}"
      href="../../static/css/user/mypage-donation-detail.css"
    />

  </head>
  <body>
    <main>
        
        <div style="position: relative;">
          <img th:src="@{/images/certi/certificate.png}" alt="Certificate" style="width: 65%; height: 95%;">
          <div style="position: absolute; top: 47%; left: 16%; transform: translate(-50%, -50%);
                      color: rgb(0, 0, 0); font-size: 28px; text-align: left;" th:text="${user.userName}">
                      김태영
          </div>
          <div style="position: absolute; top: 81.5%; left: 47%; transform: translate(-50%, -50%);
                      color: rgb(0, 0, 0); font-size: 18px; text-align: left;" th:text="${#temporals.format(donation.donatedDate, 'yyyy년 MM월 dd일')}"
                      >
          </div>
        </div>
    </main>
  </body>
</html>
