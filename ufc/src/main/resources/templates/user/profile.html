<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP-DA - 사용자 프로필</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css" th:href="@{/css/styles.css}">
    <script th:src="@{/js/script.js}"></script>
</head>
<body>
    <div class="container">
        <div class="user-profile bg-white shadow-lg rounded-lg max-w-4xl mx-auto my-8 p-8">
            <h1 class="text-3xl font-bold text-green-700 mb-8">사용자 프로필</h1>

            <div class="grid md:grid-cols-3 gap-8">
                <div class="md:col-span-1">
                    <div class="relative mb-6">
                        <div class="avatar w-32 h-32 mx-auto">
                            <img src="/placeholder.svg?height=128&width=128" alt="홍길동" class="rounded-full">
                        </div>
                        <button class="btn-icon absolute bottom-0 right-1/2 transform translate-x-1/2 translate-y-1/2 rounded-full">
                            <i data-lucide="camera" class="h-4 w-4"></i>
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div class="editable-field" data-field="name">
                            <label for="name" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                                <i data-lucide="user" class="w-5 h-5 text-gray-500"></i>
                                <span class="ml-2">이름</span>
                            </label>
                            <div class="flex items-center">
                                <input type="text" id="name" name="name" value="홍길동" readonly class="flex-grow bg-gray-100">
                                <button class="btn-icon btn-edit ml-2">
                                    <i data-lucide="edit-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </div>
                        <div class="editable-field" data-field="email">
                            <label for="email" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                                <i data-lucide="mail" class="w-5 h-5 text-gray-500"></i>
                                <span class="ml-2">이메일</span>
                            </label>
                            <div class="flex items-center">
                                <input type="email" id="email" name="email" value="hong@example.com" readonly class="flex-grow bg-gray-100">
                                <button class="btn-icon btn-edit ml-2">
                                    <i data-lucide="edit-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </div>
                        <div class="editable-field" data-field="phone">
                            <label for="phone" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                                <i data-lucide="phone" class="w-5 h-5 text-gray-500"></i>
                                <span class="ml-2">전화번호</span>
                            </label>
                            <div class="flex items-center">
                                <input type="tel" id="phone" name="phone" value="010-1234-5678" readonly class="flex-grow bg-gray-100">
                                <button class="btn-icon btn-edit ml-2">
                                    <i data-lucide="edit-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </div>
                        <div class="editable-field" data-field="address">
                            <label for="address" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                                <i data-lucide="map-pin" class="w-5 h-5 text-gray-500"></i>
                                <span class="ml-2">주소</span>
                            </label>
                            <div class="flex items-center">
                                <input type="text" id="address" name="address" value="서울특별시 강남구" readonly class="flex-grow bg-gray-100">
                                <button class="btn-icon btn-edit ml-2">
                                    <i data-lucide="edit-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <div class="mb-6">
                        <h2 class="text-xl font-semibold text-green-700 mb-2">자기 소개</h2>
                        <div class="editable-field" data-field="bio">
                            <label for="bio" class="flex items-center text-sm font-medium text-gray-700 mb-1">
                                <i data-lucide="user" class="w-5 h-5 text-gray-500"></i>
                                <span class="ml-2">자기 소개</span>
                            </label>
                            <div class="flex items-center">
                                <textarea id="bio" name="bio" rows="4" readonly class="flex-grow bg-gray-100">안녕하세요! 저는 지속 가능한 미래를 위해 노력하는 열정적인 업사이클러입니다.</textarea>
                                <button class="btn-icon btn-edit ml-2">
                                    <i data-lucide="edit-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h2 class="text-xl font-semibold text-green-700 mb-2">관심사</h2>
                        <div class="flex flex-wrap gap-2">
                            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm">친환경</span>
                            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm">재활용</span>
                            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm">업사이클링</span>
                            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm">지속가능성</span>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-semibold text-green-700 mb-2">후원 내역</h2>
                        <div class="space-y-4">
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="font-medium">플라스틱 병으로 만든 패션 액세서리</h3>
                                    <span class="text-sm text-gray-500">2023-05-15</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-green-600 font-bold">50,000원</span>
                                    <div class="progress w-1/2">
                                        <div class="progress-bar" style="width: 33%;"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="font-medium">재활용 목재 가구 컬렉션</h3>
                                    <span class="text-sm text-gray-500">2023-06-22</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-green-600 font-bold">100,000원</span>
                                    <div class="progress w-1/2">
                                        <div class="progress-bar" style="width: 33%;"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="font-medium">업사이클링 패션 브랜드 런칭</h3>
                                    <span class="text-sm text-gray-500">2023-07-30</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-green-600 font-bold">200,000원</span>
                                    <div class="progress w-1/2">
                                        <div class="progress-bar" style="width: 33%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 bg-green-50 p-6 rounded-lg">
                <h2 class="text-xl font-semibold text-green-700 mb-4">활동 요약</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-lg shadow text-center">
                        <p class="text-2xl font-bold text-green-600">3</p>
                        <p class="text-sm text-gray-600">후원한 프로젝트</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow text-center">
                        <p class="text-2xl font-bold text-green-600">2</p>
                        <p class="text-sm text-gray-600">제안한 프로젝트</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow text-center">
                        <p class="text-2xl font-bold text-green-600">350,000원</p>
                        <p class="text-sm text-gray-600">총 후원 금액</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow text-center">
                        <p class="text-2xl font-bold text-green-600">50kg</p>
                        <p class="text-sm text-gray-600">재활용 자원 기여</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
